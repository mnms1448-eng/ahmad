<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الأمير سلطان الرقمية</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>body{font-family:Tahoma,sans-serif}</style>
</head>
<body class="bg-slate-100">
<nav class="bg-blue-900 text-white p-4">
<div class="max-w-7xl mx-auto flex justify-between">
<h1 class="font-bold">منصة الأمير سلطان الرقمية</h1>
<div class="space-x-3">
<button onclick="showSection('dashboard')">لوحة المدير</button>
<button onclick="showSection('teachers')">المعلمون</button>
</div></div></nav>
<div id="content" class="max-w-7xl mx-auto p-6"></div>
<script>
let state=JSON.parse(localStorage.getItem('schoolData'))||{teachers:[{name:'أحمد السلمي',evaluation:95},{name:'محمد الزهراني',evaluation:88},{name:'خالد الغامدي',evaluation:91}]};
function save(){localStorage.setItem('schoolData',JSON.stringify(state));}
function showSection(page){
const c=document.getElementById('content');
if(page==='dashboard'){
const avg=state.teachers.length?Math.round(state.teachers.reduce((a,b)=>a+Number(b.evaluation),0)/state.teachers.length):0;
c.innerHTML=`<div class='grid md:grid-cols-4 gap-4 mb-6'>
<div class='bg-white p-5 rounded shadow'><h3>عدد المعلمين</h3><div class='text-3xl font-bold'>${state.teachers.length}</div></div>
<div class='bg-green-600 text-white p-5 rounded shadow'><h3>متوسط الأداء</h3><div class='text-3xl font-bold'>${avg}%</div></div>
</div>
<div class='bg-white p-6 rounded shadow'><canvas id='teachersChart'></canvas></div>`;
new Chart(document.getElementById('teachersChart'),{type:'bar',data:{labels:state.teachers.map(t=>t.name),datasets:[{label:'الأداء',data:state.teachers.map(t=>t.evaluation),backgroundColor:'#003366'}]},options:{scales:{y:{max:100,min:0}}}});
}
if(page==='teachers'){
c.innerHTML=`<div class='bg-white p-6 rounded shadow mb-4'>
<div class='grid md:grid-cols-3 gap-2'>
<input id='name' class='border p-2' placeholder='اسم المعلم'>
<input id='eval' type='number' class='border p-2' placeholder='التقييم'>
<button onclick='addTeacher()' class='bg-blue-900 text-white rounded p-2'>إضافة</button>
</div></div>
<div id='list'></div>`;
renderTeachers();
}
}
function addTeacher(){const n=document.getElementById('name').value;const e=document.getElementById('eval').value;if(!n)return;state.teachers.push({name:n,evaluation:Number(e)||0});save();showSection('teachers');}
function renderTeachers(){document.getElementById('list').innerHTML=state.teachers.map(t=>`<div class='bg-white p-4 rounded shadow mb-2 flex justify-between'><span>${t.name}</span><span>${t.evaluation}%</span></div>`).join('');}
showSection('dashboard');
</script>
</body>
</html>
